<style>

        }

            animation: revealUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes revealUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .image-float {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }

<body class="flex flex-col min-h-screen">

</div>

<script>
        // Simple micro-interaction for button press
        const nextButton = document.querySelector('button');
        nextButton.addEventListener('click', () => {
            // Placeholder for navigation to next onboarding screen
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                console.log('Navigating to Screen 3...');
                // In a real app: window.location.href = 'onboarding-3.html';
            }, 500);
        });

        // Atmosphere: Subtle mouse movement effect on hero
        if (window.innerWidth > 768) {
            document.addEventListener('mousemove', (e) => {
                const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
                const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
                const hero = document.querySelector('.image-float');
                if (hero) {
                    hero.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            });
        }
    </script>
