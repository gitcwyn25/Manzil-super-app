<script>
        /**
         * Simple tab switcher logic to toggle between Consumer and Business views
         */
        function switchTab(type) {
            const bizField = document.getElementById('business-field');
            const tabConsumer = document.getElementById('tab-consumer');
            const tabBusiness = document.getElementById('tab-business');
            
            // Shared styling classes
            const activeClasses = ['bg-white', 'text-on-surface', 'shadow-sm', 'ring-1', 'ring-black/5'];
            const inactiveClasses = ['text-outline', 'hover:text-on-surface'];

            if (type === 'consumer') {
                bizField.classList.add('hidden');
                
                // Toggle Consumer Active
                tabConsumer.classList.add(...activeClasses);
                tabConsumer.classList.remove(...inactiveClasses);
                
                // Toggle Business Inactive
                tabBusiness.classList.remove(...activeClasses);
                tabBusiness.classList.add(...inactiveClasses);
            } else {
                bizField.classList.remove('hidden');
                
                // Toggle Business Active
                tabBusiness.classList.add(...activeClasses);
                tabBusiness.classList.remove(...inactiveClasses);
                
                // Toggle Consumer Inactive
                tabConsumer.classList.remove(...activeClasses);
                tabConsumer.classList.add(...inactiveClasses);
            }
        }

        // Initialize state (Business selected by default as per request)
        document.addEventListener('DOMContentLoaded', () => {
            switchTab('business');
        });
    </script>
