<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_15 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_15" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_15');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Three.js Scene: Floating 3D "Manzil" Nodes and Fluid Waves
// Inspired by Sirly.uz aesthetic: deep greens, fluid motion, and glassmorphism.

const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });

renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);

const pointLight = new THREE.PointLight(0x007aff, 1);
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// Group for floating elements
const group = new THREE.Group();
scene.add(group);

// Create "Experience Nodes" (Glassy spheres)
const geometry = new THREE.SphereGeometry(0.5, 32, 32);
const material = new THREE.MeshPhongMaterial({
    color: 0x007aff,
    emissive: 0x001a33,
    specular: 0xffffff,
    shininess: 100,
    transparent: true,
    opacity: 0.8
});

for (let i = 0; i < 15; i++) {
    const node = new THREE.Mesh(geometry, material);
    node.position.set(
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 10,
        (Math.random() - 0.5) * 5
    );
    node.userData = {
        speed: Math.random() * 0.01 + 0.005,
        offset: Math.random() * Math.PI * 2
    };
    group.add(node);
}

camera.position.z = 8;

// Mouse Tracking
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
    mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

function animate() {
    requestAnimationFrame(animate);

    const time = Date.now() * 0.001;

    group.children.forEach((node) => {
        node.position.y += Math.sin(time + node.userData.offset) * node.userData.speed;
        node.position.x += Math.cos(time + node.userData.offset) * node.userData.speed;
    });

    group.rotation.y += (mouseX * 0.5 - group.rotation.y) * 0.05;
    group.rotation.x += (mouseY * 0.5 - group.rotation.x) * 0.05;

    renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
    const w = container.clientWidth || window.innerWidth;
    const h = container.clientHeight || window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
});

animate();
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_15 -->
</body>
</html>
