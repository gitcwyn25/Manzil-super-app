# Manzil API on Oracle Cloud Always Free (Ampere A1, arm64).
# One VM runs the whole stack: Caddy (TLS) -> API -> Redis.
# Secrets live in ./.env (never committed) — see .env.example.
services:
  api:
    image: ghcr.io/gitcwyn25/manzil-api:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "4000"
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # The API treats Redis as cache + throttle buckets; cap memory well below
    # the VM's RAM and evict rather than OOM.
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  redis_data:
  caddy_data:
  caddy_config:
