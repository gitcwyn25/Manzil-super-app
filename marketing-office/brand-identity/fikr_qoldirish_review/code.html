<script>
        document.addEventListener('DOMContentLoaded', () => {
            const starBtns = document.querySelectorAll('.star-btn');
            const ratingLabel = document.getElementById('rating-label');
            const labels = ["Yomon", "Qoniqarsiz", "Yaxshi", "Juda yaxshi", "Ajoyib!"];
            
            starBtns.forEach((btn, index) => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const rating = index + 1;
                    
                    // Reset all
                    starBtns.forEach(b => {
                        b.querySelector('.material-symbols-outlined').classList.remove('star-active');
                    });
                    
                    // Fill up to rating
                    for(let i = 0; i < rating; i++) {
                        starBtns[i].querySelector('.material-symbols-outlined').classList.add('star-active');
                    }
                    
                    ratingLabel.textContent = labels[index];
                    ratingLabel.classList.add('text-secondary-container', 'font-bold');
                });
            });

            // Prevent default form submission for demo
            document.getElementById('review-form').addEventListener('submit', (e) => {
                e.preventDefault();
                alert('Rahmat! Fikringiz qabul qilindi.');
            });
        });
    </script>
