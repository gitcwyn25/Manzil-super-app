<span>Yuborish</span>
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>

<script>
        // Star Rating Logic
        const starContainer = document.getElementById('star-rating');
        const stars = starContainer.querySelectorAll('span');
        let currentRating = 0;

        stars.forEach(star => {
            star.addEventListener('click', () => {
                const rating = parseInt(star.getAttribute('data-rating'));
                currentRating = rating;
                updateStars(rating);
            });
        });

        function updateStars(rating) {
            stars.forEach((star, index) => {
                if (index < rating) {
                    star.classList.add('star-active');
                } else {
                    star.classList.remove('star-active');
                }
            });
        }

        // Simple button interaction
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.addEventListener('click', () => {
            if (currentRating === 0) {
                alert('Iltimos, avval baho bering!');
                return;
            }
            
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> <span>Yuborilmoqda...</span>';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80');
            
            setTimeout(() => {
                submitBtn.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> <span>Muvaffaqiyatli yuborildi!</span>';
                submitBtn.classList.replace('bg-primary', 'bg-secondary-container');
                submitBtn.classList.replace('text-on-primary', 'text-on-secondary-container');
                
                setTimeout(() => {
                    window.history.back();
                }, 1500);
            }, 2000);
        });

        // Photo Upload Simulation
        const addPhotoBtn = document.getElementById('add-photo-btn');
        addPhotoBtn.addEventListener('click', () => {
            // Triggering visual feedback
            addPhotoBtn.classList.add('bg-primary-container', 'border-primary');
            setTimeout(() => {
                addPhotoBtn.classList.remove('bg-primary-container', 'border-primary');
            }, 200);
        });
    </script>
