<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #f9f9f7;
            color: #1a1c1b;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        .onboarding-canvas {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
            position: relative;
        }
        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

<body class="antialiased">
<!-- Onboarding Container -->
<main class="onboarding-canvas">
<!-- Header Actions: Skip (O'tkazib yuborish) -->
<header class="flex justify-end pt-sm">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors duration-200">
                O'tkazib yuborish
            </button>
</header>
<!-- Hero Section: Image -->
<section class="flex-grow flex flex-col items-center justify-center py-xl fade-in" style="animation-delay: 0.1s;">
<div class="relative w-full aspect-square max-w-[320px] mb-lg">
<!-- Illustration Placeholder -->
<img alt="Manzil Onboarding Illustration" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuClImFG12DO36E5L0sTM1zGxuze033-ymPBbL2RkimN34Xo5pchNCGqwnXtYHHmHoV3F0L1OCY0K60IP-NCawiztoK8RptVw3CaWZHgMxttnpsw3OL2LzL9bsK-1Bsf9Ly1mv-vIKifdIu6wHjIJ9L3-2QqEeTFCLxaVWtVbxunzSnKs64zXRTP7DjW2z1yQMYlbBd2nFQMknvjwXNhWdYZkFf6dDMzwuszCZ-SXGbbXu7sjILUMiht7mgoJvser6MxJzc2oi9fjzA"/>
<!-- Atmospheric background glow -->
<div class="absolute -z-10 inset-0 bg-primary/5 rounded-full blur-3xl"></div>
</div>
<!-- Content Group -->
<div class="text-center px-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-md tracking-tight">
                    O'zbekistondagi eng yaxshi joylarni kashf qiling
                </h1>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                    Mahalliy aholi tomonidan tavsiya etilgan eng sara restoranlar, do'konlar va xizmatlar.
                </p>
</div>
</section>
<!-- Footer Section: Indicators & Action -->
<footer class="mt-auto flex flex-col items-center gap-xl pb-xl fade-in" style="animation-delay: 0.3s;">
<!-- Indicators (Shared Components Context: BottomNavBar dots) -->
<div class="flex items-center justify-center gap-xs">
<!-- Active Dot -->
<span class="w-2.5 h-2.5 rounded-full bg-secondary-container transition-all duration-300"></span>
<!-- Inactive Dots -->
<span class="w-2 h-2 rounded-full bg-outline-variant/40"></span>
<span class="w-2 h-2 rounded-full bg-outline-variant/40"></span>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-md rounded-lg shadow-sm hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-xs">
                Keyingisi
                <span class="material-symbols-outlined text-[18px]">chevron_right</span>
</button>
</footer>
</main>
<!-- Shared Components Hidden Logic (BottomNavBar/TopAppBar Suppressed for Transactional/Onboarding as per Mandate) -->
<script>
        // Simple micro-interaction for the button
        document.querySelector('button.bg-primary').addEventListener('click', function() {
            this.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
            setTimeout(() => {
                // Future navigation logic would go here
                console.log('Navigating to next screen...');
                // For demo, reset
                this.innerHTML = 'Keyingisi <span class="material-symbols-outlined text-[18px]">chevron_right</span>';
            }, 800);
        });

        // Subtle parallax or float effect on the illustration could be added here
        const heroImg = document.querySelector('img');
        if(heroImg) {
            window.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth - 0.5) * 15;
                const y = (e.clientY / window.innerHeight - 0.5) * 15;
                heroImg.style.transform = `translate(${x}px, ${y}px)`;
            });
        }
    </script>
</body></html>
