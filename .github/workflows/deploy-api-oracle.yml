name: Deploy API to Oracle VM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "packages/shared/**"
      - "package-lock.json"
      - "infra/oracle/**"
      - ".github/workflows/deploy-api-oracle.yml"

concurrency:
  group: deploy-api-oracle
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Ampere A1 is arm64 — build for it explicitly.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/manzil-api:latest
            ghcr.io/${{ github.repository_owner }}/manzil-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ORACLE_VM_HOST }}
          username: ubuntu
          key: ${{ secrets.ORACLE_VM_SSH_KEY }}
          script: |
            cd ~/manzil
            docker compose pull api
            docker compose up -d
            sleep 10
            docker compose ps
            wget -qO- http://127.0.0.1:4000/v1/health || (docker compose logs --tail 50 api; exit 1)
