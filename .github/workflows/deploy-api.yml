name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/shared/**"
      - "packages/db/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

# Never run two deploys concurrently — the second would race the first's
# migration step. Deploys are not cancelled in progress: killing a job
# mid-migration is how you get a half-applied schema.
concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Staging first. Production is gated on this passing, so a broken build or a
  # bad migration is caught against a real deployment before users see it.
  # ---------------------------------------------------------------------------
  staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build API
        run: npm run build --workspace @manzil/api

      - name: Run migrations (staging)
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}

      # `railway up` deploys your code. The previous `railway deploy` provisions
      # a *template* (a database, etc.) and, with no --template flag, prompts
      # interactively — so it never deployed this API at all.
      - name: Deploy to Railway (staging)
        run: |
          npm install -g @railway/cli
          railway up --ci --service "${{ secrets.RAILWAY_SERVICE_NAME }}" --environment staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_STAGING_TOKEN }}

      - name: Smoke test staging
        run: node tech-office/scripts/smoke-test.mjs "${{ secrets.STAGING_API_URL }}"

  # ---------------------------------------------------------------------------
  # Production. Only reached when staging deployed and passed its smoke test.
  # ---------------------------------------------------------------------------
  production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: staging
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build API
        run: npm run build --workspace @manzil/api

      # Migrations run before the new code ships, so they must be
      # backwards-compatible with the currently-running version (expand first,
      # contract in a later release). A destructive migration here breaks the
      # live deployment during the window before the new code is active.
      - name: Run migrations (production)
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Railway (production)
        run: |
          npm install -g @railway/cli
          railway up --ci --service "${{ secrets.RAILWAY_SERVICE_NAME }}" --environment production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      # Railway's own healthcheck (railway.json -> healthcheckPath) already
      # blocks an unhealthy container from taking traffic. This goes further:
      # it verifies the deployment that *did* go live actually serves correct
      # responses, including auth enforcement and security headers.
      - name: Smoke test production
        id: smoke
        run: node tech-office/scripts/smoke-test.mjs "${{ secrets.PRODUCTION_API_URL }}"

      - name: Roll back on smoke-test failure
        if: failure() && steps.smoke.outcome == 'failure'
        run: node tech-office/scripts/railway-rollback.mjs
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_PRODUCTION_ENVIRONMENT_ID }}

      - name: Verify rollback restored a healthy service
        if: failure() && steps.smoke.outcome == 'failure'
        run: |
          echo "Waiting for the rolled-back deployment to become active..."
          sleep 30
          node tech-office/scripts/smoke-test.mjs "${{ secrets.PRODUCTION_API_URL }}"
