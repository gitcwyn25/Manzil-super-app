name: Lint & Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 18 is end-of-life and this repo's toolchain (Next 16, Prisma 6)
        # no longer supports it; testing on it would fail for reasons unrelated
        # to the change under review.
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code that typecheck depends on; without
      # it every workspace importing @prisma/client fails to compile in CI.
      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck --workspaces --if-present

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Unit tests
        run: npm run test --workspaces --if-present

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    # Runs only after the cheap checks pass — no point booting a database, an
    # API, a web server and a browser to discover the code does not compile.
    needs: lint-and-test

    # A real Postgres, because the suite runs against the real API. Running the
    # web app in mock mode would be far simpler, but it would not have caught
    # the review-submission bug this suite exists for — that failure only
    # appears when a real request round-trips through the real API.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
      NEXT_PUBLIC_API_URL: http://localhost:4000/v1
      NEXT_PUBLIC_USE_MOCK: "false"
      BASE_URL: http://localhost:3000
      # Clerk **test**-instance keys. The authenticated specs provision a user
      # via the Backend API and sign in for real, so a live-instance key must
      # never be used here — the fixture refuses anything that is not sk_test_.
      CLERK_SECRET_KEY: ${{ secrets.CLERK_TEST_SECRET_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_TEST_PUBLISHABLE_KEY }}
      # Without Clerk secrets the authenticated specs cannot run at all, so the
      # job falls back to the unauthenticated subset rather than failing on
      # every PR from a fork, which cannot read secrets.
      SKIP_AUTH_SETUP: ${{ secrets.CLERK_TEST_SECRET_KEY == '' && '1' || '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to the test database
        run: npm run db:migrate:deploy

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: |
          npm run build:shared
          npm run build --workspace @manzil/api
          npm run build --workspace @manzil/web

      # When Clerk test keys are present the API verifies real tokens, exactly
      # as production does. Dev headers are the fallback only when they are not
      # — ClerkAuthService refuses header auth whenever Clerk is configured,
      # and refuses it outright in production.
      - name: Start API
        run: |
          MANZIL_DEV_AUTH=true NODE_ENV=development WEB_ORIGIN=http://localhost:3000 PORT=4000 \
            node apps/api/dist/main.js &
          npx wait-on http://localhost:4000/v1/health --timeout 90000

      - name: Start web
        run: |
          npm run start --workspace @manzil/web &
          npx wait-on http://localhost:3000 --timeout 120000

      # The database is empty here, so data-dependent assertions skip rather
      # than fail — the structural and security assertions (terms checkbox
      # required, no request on invalid input, admin routes gated) still run.
      - name: Run E2E suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
