name: Database Migrations

on:
  pull_request:
    branches: [main]
    # The schema lives at packages/db/schema.prisma — there is no root prisma/
    # directory, so the previous "prisma/**" filter never matched and this
    # workflow had never run on any change.
    paths:
      - "packages/db/**"
      - ".github/workflows/db-migrate.yml"
  push:
    branches: [main]
    paths:
      - "packages/db/**"
      - ".github/workflows/db-migrate.yml"

permissions:
  contents: read

jobs:
  validate-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema syntax
        run: npx prisma validate --schema packages/db/schema.prisma

      # `migrate deploy` applies the committed migration files exactly as
      # production will. The previous `migrate dev` is interactive and *authors*
      # new migrations — it could not verify what is actually committed.
      - name: Apply committed migrations
        run: npm run db:migrate:deploy

      # Catches the case where schema.prisma was edited but no migration was
      # generated for it — that change would silently never reach production.
      - name: Check for schema/migration drift
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel packages/db/schema.prisma \
            --exit-code \
          && echo "No drift: committed migrations match schema.prisma"
